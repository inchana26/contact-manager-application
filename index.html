<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Manager</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1 class="title">Contact Manager</h1>

    <!-- Search Section -->

<div class="neo-card search-box">

  <input
    type="text"
    id="searchInput"
    placeholder="Search contact by name..."
  />

  <button class="btn" id="searchBtn">
    Search
  </button>

</div>

    <!-- Form -->
    <div class="neo-card">
      <h2 id="formTitle">Add Contact</h2>

      <form id="contactForm">

        <input
          type="text"
          id="name"
          placeholder="Name"
          required
        />

        <input
          type="email"
          id="email"
          placeholder="Email"
          required
        />

        <input
          type="text"
          id="phone"
          placeholder="Phone"
          required
        />

        <button type="submit" class="btn">
          Save Contact
        </button>

      </form>
    </div>

    <!-- Contact List -->
    <div class="neo-card">
      <h2>All Contacts</h2>

      <div id="contactList"></div>
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
